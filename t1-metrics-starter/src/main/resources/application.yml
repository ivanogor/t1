spring:
  datasource:
    url: jdbc:h2:tcp://localhost:1521/mem:testdb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master-metric.xml

liquibase:
  searchPath: classpath:/db/changelog
t1:
  metrics:
    enabled: true
    database:
      enabled: true
  time:
    threshold: 10000